<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluitek - Reportes Técnicos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .fluitek-logo-badge { background-color: #000; color: #fff; font-weight: 900; }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen">

    <!-- Header -->
    <header class="bg-slate-900 text-white p-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="fluitek-logo-badge text-xl px-3 py-1 rounded">FLUITEK</div>
            <h1 class="text-lg font-bold">Field & Technical Reports</h1>
        </div>
        <div class="space-x-2">
            <button onclick="openModal()" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-4 py-2 rounded text-sm transition">
                <i class="fa-solid fa-plus-circle mr-1"></i> Nuevo Reporte / OT
            </button>
            <button onclick="exportCSV()" class="bg-slate-800 hover:bg-slate-700 text-white px-3 py-2 rounded text-sm border border-slate-700">
                Exportar CSV
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto p-6">
        <!-- KPIs -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white p-4 rounded-xl shadow border-l-4 border-slate-900">
                <p class="text-xs uppercase text-slate-500 font-bold">Total Reportes</p>
                <h3 id="kpi-total" class="text-2xl font-bold">0</h3>
            </div>
            <div class="bg-white p-4 rounded-xl shadow border-l-4 border-red-500">
                <p class="text-xs uppercase text-slate-500 font-bold">Criticidad Alta</p>
                <h3 id="kpi-critical" class="text-2xl font-bold text-red-600">0</h3>
            </div>
            <div class="bg-white p-4 rounded-xl shadow border-l-4 border-amber-500">
                <p class="text-xs uppercase text-slate-500 font-bold">Advertencia</p>
                <h3 id="kpi-warning" class="text-2xl font-bold text-amber-600">0</h3>
            </div>
            <div class="bg-white p-4 rounded-xl shadow border-l-4 border-emerald-500">
                <p class="text-xs uppercase text-slate-500 font-bold">Normal</p>
                <h3 id="kpi-normal" class="text-2xl font-bold text-emerald-600">0</h3>
            </div>
        </div>

        <!-- Acciones -->
        <div class="flex justify-between items-center mb-4">
            <input type="text" id="search" oninput="render()" placeholder="Buscar por OT, cliente, tag..." class="p-2 border rounded-lg w-72 text-sm">
            <button onclick="loadSample()" class="text-xs text-slate-600 underline font-semibold">Cargar Ejemplos</button>
        </div>

        <!-- Tabla -->
        <div class="bg-white rounded-xl shadow overflow-x-auto">
            <table class="w-full text-left border-collapse text-sm">
                <thead>
                    <tr class="bg-slate-100 text-slate-600 border-b">
                        <th class="p-3">Folio / OT</th>
                        <th class="p-3">Cliente</th>
                        <th class="p-3">Equipo / Tag</th>
                        <th class="p-3">Criticidad</th>
                        <th class="p-3">Inspector</th>
                        <th class="p-3 text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="divide-y"></tbody>
            </table>
        </div>
    </main>

    <!-- Modal Formulario -->
    <div id="modal" class="fixed inset-0 bg-slate-900/60 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl p-6 overflow-y-auto max-h-[90vh]">
            <h3 class="text-lg font-bold mb-4 text-slate-900">Crear Nuevo Reporte</h3>
            <form onsubmit="saveReport(event)" class="space-y-3">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold mb-1">Orden de Trabajo (OT)</label>
                        <input type="text" id="inOT" required placeholder="OT-1001" class="w-full p-2 border rounded text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1">Cliente</label>
                        <input type="text" id="inCliente" required placeholder="Minera X" class="w-full p-2 border rounded text-sm">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold mb-1">Equipo / Tag</label>
                        <input type="text" id="inTag" required placeholder="RED-9000" class="w-full p-2 border rounded text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1">Inspector</label>
                        <input type="text" id="inInspector" required placeholder="Nombre" class="w-full p-2 border rounded text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1">Criticidad</label>
                    <select id="inCriticidad" class="w-full p-2 border rounded text-sm font-bold">
                        <option value="NORMAL">🟢 Normal</option>
                        <option value="MEDIA">🟡 Advertencia</option>
                        <option value="ALTA">🔴 Alta / Alarma</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1">Diagnóstico Técnico</label>
                    <textarea id="inDiagnostico" rows="3" required placeholder="Observaciones de terreno..." class="w-full p-2 border rounded text-sm"></textarea>
                </div>
                <div class="flex justify-end space-x-2 pt-3">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded text-sm">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-slate-900 text-white rounded text-sm font-bold">Guardar Reporte</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script sin dependencias complejas -->
    <script>
        let reports = [];

        function openModal() {
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function saveReport(e) {
            e.preventDefault();
            const newReport = {
                id: 'FLT-' + Math.floor(100 + Math.random() * 900),
                ot: document.getElementById('inOT').value,
                cliente: document.getElementById('inCliente').value,
                tag: document.getElementById('inTag').value,
                inspector: document.getElementById('inInspector').value,
                criticidad: document.getElementById('inCriticidad').value,
                diagnostico: document.getElementById('inDiagnostico').value
            };
            reports.unshift(newReport);
            render();
            closeModal();
            e.target.reset();
        }

        function deleteReport(id) {
            reports = reports.filter(r => r.id !== id);
            render();
        }

        function loadSample() {
            reports = [
                { id: 'FLT-001', ot: 'OT-88412', cliente: 'Minera Candelaria', tag: 'RED-PARAMAX-9000', criticidad: 'ALTA', inspector: 'Carlos Mendoza', diagnostico: 'Presencia de virutas metálicas en aceite.' },
                { id: 'FLT-002', ot: 'OT-88413', cliente: 'Pelambres', tag: 'BOMBA-HYD-01', criticidad: 'NORMAL', inspector: 'Andrea Rojas', diagnostico: 'Sin anomalías.' }
            ];
            render();
        }

        function render() {
            const tbody = document.getElementById('tableBody');
            const search = document.getElementById('search').value.toLowerCase();
            tbody.innerHTML = '';

            const filtered = reports.filter(r => 
                r.ot.toLowerCase().includes(search) || 
                r.cliente.toLowerCase().includes(search) || 
                r.tag.toLowerCase().includes(search)
            );

            document.getElementById('kpi-total').innerText = reports.length;
            document.getElementById('kpi-critical').innerText = reports.filter(r => r.criticidad === 'ALTA').length;
            document.getElementById('kpi-warning').innerText = reports.filter(r => r.criticidad === 'MEDIA').length;
            document.getElementById('kpi-normal').innerText = reports.filter(r => r.criticidad === 'NORMAL').length;

            filtered.forEach(r => {
                let badge = 'bg-emerald-100 text-emerald-800';
                if (r.criticidad === 'ALTA') badge = 'bg-red-100 text-red-800';
                if (r.criticidad === 'MEDIA') badge = 'bg-amber-100 text-amber-800';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-3 font-bold">${r.id} <span class="text-xs text-amber-700 block">${r.ot}</span></td>
                    <td class="p-3">${r.cliente}</td>
                    <td class="p-3 font-mono text-xs">${r.tag}</td>
                    <td class="p-3"><span class="px-2 py-1 rounded text-xs font-bold ${badge}">${r.criticidad}</span></td>
                    <td class="p-3 text-xs">${r.inspector}</td>
                    <td class="p-3 text-center">
                        <button onclick="deleteReport('${r.id}')" class="text-red-600 hover:text-red-800 font-bold text-xs">Eliminar</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function exportCSV() {
            if (reports.length === 0) return alert('No hay datos');
            let csv = 'Folio,OT,Cliente,Tag,Criticidad,Inspector\n';
            reports.forEach(r => csv += "${r.id}","${r.ot}","${r.cliente}","${r.tag}","${r.criticidad}","${r.inspector}"\n);
            const blob = new Blob([csv], { type: 'text/csv' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'reportes.csv';
            link.click();
        }
    </script>
</body>
</html>
